<!doctype html>
<html><head><meta charset="utf-8">
<script src="cues.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070a1f; }
body { font-family: "Inter Display", Inter, "Noto Color Emoji", sans-serif; color: #fff; }
#bg { position: absolute; inset: 0; }
#world { position: absolute; inset: 0; transform-origin: 540px 960px; }
#world .o { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#notes { position: absolute; left: 0; top: 0; }
#hud { position: absolute; inset: 0; pointer-events: none; }
.t { position: absolute; left: 60px; right: 60px; text-align: center; font-weight: 900; line-height: .95; }
.t span { display: inline-block; white-space: pre; will-change: transform; }
.y { color: #ffd23f; } .g { color: #3ddc84; } .r { color: #ff4757; } .b { color: #5fd3ff; }
.sh { text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.55); }
.pill { display: inline-block; padding: 14px 36px; border-radius: 999px; font-weight: 900; }
.handle { position: absolute; top: 74px; left: 0; right: 0; text-align: center; font: 800 30px "Inter Display", Inter; letter-spacing: 3px; color: rgba(255,255,255,.55); }
.prog { position: absolute; top: 46px; left: 90px; right: 90px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
.prog i { display: block; height: 100%; background: #ffd23f; width: 0; }
.shadow { width: 900px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.lbl { padding: 14px 32px; border-radius: 20px; font-weight: 900; font-size: 48px; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.emo { font-size: 150px; line-height: 1; }
#vid { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; }
#vshade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.25) 24%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 62%, rgba(0,0,0,.78) 100%); pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.ico { filter: drop-shadow(0 26px 30px rgba(0,0,0,.5)); }
.card { padding: 26px 50px; border-radius: 40px; background: rgba(255,255,255,.96); color: #0c1a2e; text-align: center; box-shadow: 0 28px 56px rgba(0,0,0,.5); white-space: nowrap; }
.card .k { font: 900 46px/1 "Inter Display", Inter; letter-spacing: 3px; color: #7a86a0; }
.card .v { font: 900 140px/1 "Inter Display", Inter; letter-spacing: -5px; color: #0a6cff; margin-top: 8px; }
.card.y .v { color: #ff9f1a; } .card.r .v { color: #ff3b4e; } .card.g .v { color: #16b866; }
.pillw { padding: 16px 40px; border-radius: 999px; font: 900 60px/1 "Inter Display", Inter; white-space: nowrap; box-shadow: 0 18px 34px rgba(0,0,0,.45); }
.vsb { width: 400px; height: 200px; border-radius: 100px; text-align: center; font: 900 110px/200px "Inter Display", Inter; color: #fff; box-shadow: 0 26px 50px rgba(0,0,0,.5); white-space: nowrap; }

</style></head>
<body>
<div id="bg"></div>
<img id="vid" src="build/fa/0001.jpg" alt="">
<div id="vshade"></div>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbk" stdDeviation="0 0"/></filter></svg>
<div id="world">
  <canvas id="far" width="1080" height="1920" style="position:absolute;left:0;top:0"></canvas>
  <!-- S1: population (over today's Tashkent footage) -->
  <img class="o ico" id="crowd" src="icons/t01.png" style="width:560px">
  <div class="o card" id="pop"><div class="k" id="popk">HOZIR</div><div class="v" id="popv">3 MLN</div></div>
  <img class="o ico" id="crane" src="icons/t06.png" style="width:330px">
  <!-- S2: metro + New Tashkent -->
  <img class="o ico" id="metro" src="icons/t02.png" style="width:520px">
  <div class="o card" id="km"><div class="k">METRO · 2030</div><div class="v" id="kmv">71 KM</div></div>
  <img class="o ico" id="tower" src="icons/t03.png" style="width:420px">
  <div class="o card y" id="yt"><div class="k">YANGI TOSHKENT</div><div class="v">2 MLN</div></div>
  <img class="o ico" id="drone" src="icons/t04.png" style="width:380px">
  <img class="o ico" id="ev" src="icons/t05.png" style="width:360px">
  <!-- S3: water + heat -->
  <img class="o ico" id="drop" src="icons/t09.png" style="width:380px">
  <div class="o card r" id="wat"><div class="k">SUV TANQISLIGI</div><div class="v">×5</div></div>
  <img class="o ico" id="thermo" src="icons/t08.png" style="width:330px">
  <div class="o card r" id="hot"><div class="k">HAVO ALLAQACHON</div><div class="v">+1,5°C</div></div>
  <canvas id="notes" width="1080" height="1920"></canvas>
</div>
<div id="flash"></div>
<div id="hud">
  <div class="prog"><i id="prog"></i></div>
  <div class="handle">@MAMUROVLAB</div>
  <div class="t sh" data-s="0" data-in="-1" data-fx="slam" style="top:210px;font-size:140px;letter-spacing:-5px">TOSHKENT<br><span class="y">2050</span></div>
  <div class="t sh" data-s="0" data-in="q" data-fx="stamp" style="top:1560px;font-size:84px;letter-spacing:-2px"><span class="pill" style="background:#ffd23f;color:#1a1000">QANDAY BO'LADI?</span></div>
  <div class="t sh" data-s="1" data-in="0.05" data-fx="slam" style="top:210px;font-size:96px;letter-spacing:-3px">AHOLI<br><span class="y">KO'PAYADI</span></div>
  <div class="t sh" data-s="2" data-in="0.05" data-fx="slam" style="top:210px;font-size:96px;letter-spacing:-3px">YANGI<br><span class="b">METRO VA SHAHAR</span></div>
  <div class="t sh" data-s="3" data-in="0.05" data-fx="slam" style="top:210px;font-size:96px;letter-spacing:-3px">LEKIN<br><span class="r">MUAMMO HAM BOR</span></div>
  <div class="t sh" data-s="4" data-in="0.05" data-fx="slam" style="top:190px;font-size:88px;letter-spacing:-3px">2050-YILDA<br>TOSHKENTDA<br><span class="y">YASHAYSIZMI?</span></div>
  <div class="t" data-s="4" data-in="vs" data-fx="pop" style="top:1240px"><span class="vsb" style="display:inline-block;background:#3ddc84;color:#04230f;margin-right:30px">HA</span><span class="vsb" style="display:inline-block;background:#ff3b4e">YO'Q</span></div>
  <div class="t" data-s="4" data-in="send" data-fx="pop" style="top:1560px"><span class="pill" style="font-size:52px;background:#fff;color:#06101e">YOZING VA DO'STINGIZGA YUBORING</span></div>
</div>

<script>
const C = window.CUES, ST = C.starts, TOTAL = C.total;
const W = 1080, H = 1920, F = 1000;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, d) => cl((t - a) / d);
const E = {
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const sDur = i => (ST[i + 1] ?? TOTAL) - ST[i];
const cue = (s, k) => { const v = C['s' + s]?.[k]; return v === undefined ? parseFloat(k) : v; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

const A = [[0, 0], [0, 2600], [2700, 2600], [2700, 0], [0, 0]];
const SCENE_BG = [['#06101e', '#123a5a'], ['#06101e', '#123a5a'], ['#06183a', '#0f4a7a'], ['#2a0a08', '#6a1f18'], ['#06101e', '#123a5a']];

function shake(k, amp) { if (k <= 0 || k > 1.1) return [0, 0, 0]; const e = Math.exp(-k * 4.5); return [Math.sin(k * 80) * amp * e, Math.cos(k * 70) * amp * e, Math.sin(k * 55) * 1.2 * e]; }
function hold(i, u) {
  const d = sDur(i), p = E.io(cl(u / d));
  let [x, y] = A[i];
  let z = -1000 + 150 * p;
  x += Math.sin(u * 0.9 + i * 1.7) * 18; y += Math.cos(u * 0.7 + i * 2.3) * 12;
  let roll = Math.sin(u * 0.8 + i) * 1.1;
  let s = [0, 0, 0];
  if (i === 2) { y += -50 + 100 * p; }
  if (i === 3) { z = -1100 + 200 * p; const a1 = shake(u - cue(3, 'x5'), 12), a2 = shake(u - cue(3, 'heat'), 12); s = [a1[0] + a2[0], a1[1] + a2[1], a1[2] + a2[2]]; }
  return { x: x + s[0], y: y + s[1], z, roll: roll + s[2] };
}
const lerp = (a, b, p) => a + (b - a) * p;
const lc = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), z: lerp(a.z, b.z, p), roll: lerp(a.roll, b.roll, p) });
const TW = 0.26;
function sceneAt(t) { let i = 0; ST.forEach((s, k) => { if (t >= s) i = k; }); return i; }
function cam(t) {
  const i = sceneAt(t); let c = hold(i, t - ST[i]);
  if (i + 1 < ST.length && t > ST[i + 1] - TW) c = lc(c, hold(i + 1, t - ST[i + 1]), E.io(seg(t, ST[i + 1] - TW, 2 * TW)));
  if (i > 0 && t < ST[i] + TW) c = lc(hold(i - 1, t - ST[i - 1]), c, E.io(seg(t, ST[i] - TW, 2 * TW)));
  return c;
}
let CAM, FOCUS = 0;
function proj(x, y, z) { const s = F / (z - CAM.z); return { sx: W / 2 + (x - CAM.x) * s, sy: H / 2 + (y - CAM.y) * s, s }; }
const $ = id => document.getElementById(id);
function put(el, x, y, z = 0, sc = 1, rot = 0, op = 1, sx2 = 1, sy2 = 1) {
  if (typeof el === 'string') el = $(el);
  const p = proj(x, y, z);
  if (op <= 0.001 || p.s <= 0 || p.sx < -1600 || p.sx > 2700 || p.sy < -1800 || p.sy > 3700) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.style.transform = `translate(${p.sx}px,${p.sy}px) scale(${p.s * sc}) rotate(${rot}deg) scale(${sx2},${sy2}) translate(-50%,-50%)`;
  el.style.opacity = op;
  const b = Math.min(16, Math.abs(z - FOCUS) * 0.016);
  el.style.filter = b > 0.4 ? `blur(${b}px)` : '';
  el.style.zIndex = Math.round(6000 - z);
}

// ---------- no particles in this reel ----------
function drawNotes(t) {}
const pop = (u, t0, d = .35) => E.back(seg(u, t0, d)), vis = (u, t0) => cl(seg(u, t0, .1));
// ---------- Veo footage: clip A (today's Chorsu) under S0-S1, clip B (Tashkent 2050) under S4 ----------
const VID = $('vid'), FL = $('flash'), FPSV = 24, NA = window.NA || 240, NB = window.NB || 240;
function vidPick(t) {
  const i = sceneAt(t);
  if (i <= 1) return ['fa', Math.min(NA, 1 + Math.floor(t * FPSV))];
  if (i === 4) return ['fb', Math.min(NB, 1 + Math.floor((t - ST[4]) * FPSV * 1.3))];
  return null;
}
window.vidSet = async (t) => {
  const p = vidPick(t), on = !!p;
  VID.style.display = on ? '' : 'none'; $('vshade').style.display = on ? '' : 'none'; $('far').style.opacity = on ? 0 : 1; $('bg').style.opacity = on ? 0 : 1;
  let f = 0; ST.forEach((s) => { if (s > 0) f = Math.max(f, 1 - Math.abs(t - s) / 0.12); }); FL.style.opacity = Math.max(0, f) * .5;
  if (!on) return;
  const i = sceneAt(t), u = t - ST[i];
  VID.style.transform = `scale(${1.03 + 0.05 * cl(u / sDur(i)) + 0.06 * Math.max(0, 1 - u / 0.25)})`;
  VID.style.filter = i === 1 ? `brightness(${1 - .42 * cl(u / .4)}) saturate(.9)` : 'none';
  const src = `build/${p[0]}/${String(p[1]).padStart(4, '0')}.jpg`;
  if (VID.getAttribute('src') !== src) { VID.setAttribute('src', src); try { await VID.decode(); } catch (e) {} }
};
const fmt1 = v => v.toFixed(1).replace('.', ',');
function objects(t) {
  const L = i => t - ST[i];
  // S1: population counter over today's city
  { const u = L(1), [x, y] = A[1], on = t > ST[1] - .6 && t < ST[2] + .4 ? 1 : 0, n3 = cue(1, 'n3'), y5 = cue(1, 'y2050'), n5 = cue(1, 'n5');
    const k = E.io(seg(u, y5, n5 - y5 + .3));
    $('popk').textContent = u < y5 ? 'HOZIR' : '2050-YIL'; $('popv').textContent = u < y5 ? '3 MLN' : (k < 1 ? fmt1(3 + 2 * k) + ' MLN' : '5 MLN+');
    $('popv').style.color = u < y5 ? '#0a6cff' : '#ff9f1a';
    put('pop', x, y - 190, -30, 1 + .1 * Math.exp(-Math.max(0, u - n5) * 6) * (u > n5 ? 1 : 0), -2, on * vis(u, n3 - .25) );
    put('crowd', x - 60, y + 330 + Math.sin(t * 2) * 6, 0, pop(u, n3 - .1) * (1 + .18 * k), 0, on * vis(u, n3 - .1));
    put('crane', x + 250, y + 360, -40, .85 * pop(u, n5 - .1), 3, on * vis(u, n5 - .1)); }
  // S2: metro km counter, then New Tashkent
  { const u = L(2), [x, y] = A[2], on = t > ST[2] - .6 && t < ST[3] + .4 ? 1 : 0, km = cue(2, 'km'), yt = cue(2, 'yt'), m2 = cue(2, 'mln2');
    const out = E.io(seg(u, yt - .35, .45)), kk = E.out(seg(u, km, 1.1));
    $('kmv').textContent = Math.round(71 + 32 * kk) + ' KM'; $('kmv').style.color = kk >= 1 ? '#16b866' : '#0a6cff';
    put('km', x - 1000 * out, y - 230, -30, .95 * pop(u, .15) * (1 + .1 * Math.exp(-Math.max(0, u - km - 1.1) * 6) * (u > km + 1.1 ? 1 : 0)), -2, on * vis(u, .15) * (1 - out));
    put('metro', x + 60 * Math.sin(u * 1.2) - 1000 * out, y + 260, 0, pop(u, .05), 0, on * vis(u, .05) * (1 - out));
    put('yt', x + 1000 * (1 - E.out(seg(u, yt - .2, .45))), y - 230, -30, .95, 2, on * vis(u, yt - .2));
    put('tower', x - 150, y + 300, 0, pop(u, m2 - .25), -2, on * vis(u, m2 - .25));
    put('drone', x - 700 + 1000 * seg(u, yt, 3), y + 40 + Math.sin(u * 3) * 20, -120, .9, 6, on * vis(u, yt));
    put('ev', x + 250, y + 520, -60, pop(u, m2 + .1), 0, on * vis(u, m2 + .1)); }
  // S3: water and heat
  { const u = L(3), [x, y] = A[3], on = t > ST[3] - .6 && t < ST[4] + .4 ? 1 : 0, x5 = cue(3, 'x5'), ht = cue(3, 'heat');
    put('drop', x - 230, y - 140 + Math.sin(u * 2.4) * 10, 0, pop(u, .1), -4, on * vis(u, .1));
    put('wat', x + 170, y - 170, -40, .9 * (2.2 - 1.2 * E.back(seg(u, x5 - .1, .3))), -4, on * cl(seg(u, x5 - .1, .08)));
    put('thermo', x - 230, y + 420 + Math.sin(u * 2 + 1) * 8, 0, pop(u, ht - .2), 4, on * vis(u, ht - .2));
    put('hot', x + 170, y + 400, -40, .9 * (2.2 - 1.2 * E.back(seg(u, ht, .3))), 3, on * cl(seg(u, ht, .08))); }
}

const far = $('far').getContext('2d');
const bokeh = []; { const r = rng(11); for (let i = 0; i < 70; i++) bokeh.push({ x: -1600 + r() * 11000, y: -2400 + r() * 6600, z: 900 + r() * 2600, rad: 40 + r() * 120, hue: [48, 140, 200, 330, 270][Math.floor(r() * 5)] }); }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function bgAt(t) {
  const i = sceneAt(t); const a = SCENE_BG[i];
  if (i + 1 < ST.length && t > ST[i + 1] - 0.3) { const p = seg(t, ST[i + 1] - 0.3, 0.6); const b = SCENE_BG[i + 1]; return [0, 1].map(k => { const x = hex(a[k]), y = hex(b[k]); return `rgb(${x.map((v, j) => Math.round(lerp(v, y[j], p))).join(',')})`; }); }
  return a;
}
function drawBg(t) {
  const [c1, c2] = bgAt(t);
  $('bg').style.background = `radial-gradient(1200px 1400px at 50% 40%, ${c2} 0%, ${c1} 65%, #05060f 100%)`;
  far.clearRect(0, 0, W, H);
  for (const b of bokeh) {
    const p = proj(b.x, b.y, b.z); if (p.sx < -300 || p.sx > W + 300 || p.sy < -300 || p.sy > H + 300) continue;
    const r = b.rad * p.s * 2.2, g = far.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r);
    g.addColorStop(0, `hsla(${b.hue},90%,65%,.28)`); g.addColorStop(1, `hsla(${b.hue},90%,65%,0)`);
    far.fillStyle = g; far.beginPath(); far.arc(p.sx, p.sy, r, 0, 7); far.fill();
  }
}

const hudItems = [...document.querySelectorAll('#hud [data-s]')].map(el => {
  const fx = el.dataset.fx; const letters = [];
  if (fx === 'slam') {
    const walk = n => { [...n.childNodes].forEach(ch => {
      if (ch.nodeType === 3) { const frag = document.createDocumentFragment(); for (const c of ch.textContent) { const s = document.createElement('span'); s.textContent = c; frag.appendChild(s); letters.push(s); } ch.replaceWith(frag); }
      else if (ch.nodeName !== 'BR') walk(ch); }); };
    walk(el);
  }
  el.style.opacity = 0;
  return { el, s: +el.dataset.s, inK: el.dataset.in, fx, letters };
});
function hudAt(t, vel) {
  for (const it of hudItems) {
    const s0 = ST[it.s], end = (ST[it.s + 1] ?? TOTAL + 1);
    const tin = s0 + cue(it.s, it.inK), tout = end - 0.12, a = t - tin;
    if (a < 0 || t > tout + 0.2) { it.el.style.opacity = 0; continue; }
    const o = 1 - seg(t, tout, 0.2), lag = `translate(${-vel.x * 2}px, ${-vel.y * 2}px)`;
    if (it.fx === 'slam') {
      it.el.style.opacity = o; it.el.style.transform = `${lag} scale(${1 + (1 - o) * .25})`; it.el.style.filter = o < 1 ? `blur(${(1 - o) * 10}px)` : '';
      it.letters.forEach((sp, k) => { const p = seg(a - k * 0.03, 0, 0.34); sp.style.opacity = cl(p * 3);
        sp.style.transform = `translateY(${(1 - E.out(p)) * -80}px) scale(${1 + (1 - E.back(p)) * 1.6}) rotate(${(1 - E.out(p)) * -14}deg)`; });
    } else if (it.fx === 'stamp') {
      const p = seg(a, 0, 0.3), sh = a < 0.5 ? Math.sin(a * 70) * 10 * (1 - a / 0.5) : 0;
      it.el.style.opacity = cl(p * 4) * o; it.el.style.transform = `${lag} translateX(${sh}px) scale(${2.3 - 1.3 * E.back(p)}) rotate(${-6 + 6 * (1 - E.out(p))}deg)`;
    } else if (it.fx === 'pop') {
      const p = seg(a, 0, 0.35); it.el.style.opacity = cl(p * 3) * o; it.el.style.transform = `${lag} scale(${.4 + .6 * E.back(p)})`;
    }
  }
}


window.render = (t) => {
  CAM = cam(t); const pc = cam(Math.max(0, t - 1 / 60));
  const s = F / (0 - CAM.z), vel = { x: (CAM.x - pc.x) * s, y: (CAM.y - pc.y) * s };
  $('world').style.transform = `rotate(${CAM.roll}deg) scale(1.07)`;
  const bx = Math.min(36, Math.abs(vel.x) * 0.45), by = Math.min(36, Math.abs(vel.y) * 0.45);
  $('mbk').setAttribute('stdDeviation', `${bx.toFixed(1)} ${by.toFixed(1)}`);
  $('world').style.filter = (bx > 0.5 || by > 0.5) ? 'url(#mb)' : '';
  drawBg(t); objects(t); drawNotes(t); hudAt(t, vel);
  $('prog').style.width = (100 * cl(t / TOTAL)) + '%';
};
</script>
<script>const __r = window.render; window.render = async (t, s, tot) => { __r(t, s, tot); await window.vidSet(t); };</script>
</body></html>
