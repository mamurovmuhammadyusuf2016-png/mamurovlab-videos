<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display",Inter,"Noto Color Emoji",sans-serif}
.bg{position:absolute;inset:0;background:url(cover-bg.jpg) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.75) 22%,rgba(0,0,0,0) 42%,rgba(0,0,0,0) 66%,rgba(0,0,0,.85) 90%)}
.top{position:absolute;top:270px;left:0;right:0;text-align:center}
.h1{font-size:190px;font-weight:900;letter-spacing:-7px;line-height:.92;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.9)}
.h2{font-size:170px;font-weight:900;letter-spacing:-6px;line-height:.95;color:#ffd400;text-shadow:0 0 50px rgba(0,0,0,1),0 10px 30px rgba(0,0,0,.9);-webkit-text-stroke:4px #000;paint-order:stroke fill}
.bot{position:absolute;top:1420px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px}
.pill{background:#3ddc84;color:#06110a;font-weight:900;font-size:96px;letter-spacing:-3px;padding:10px 50px;border-radius:999px;box-shadow:0 14px 50px rgba(61,220,132,.45)}
.sub{color:#fff;font-weight:800;font-size:50px;text-shadow:0 4px 20px #000}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="top"><div class="h1">1 STORIS</div><div class="h2">= 1 COBALT?!</div></div>
<div class="bot"><div class="pill">$12 000 🤯</div><div class="sub">O'zbek blogerlari qancha oladi?</div></div>
</body></html>
