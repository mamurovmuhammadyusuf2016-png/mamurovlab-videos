<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}

.top{position:absolute;top:270px;left:0;right:0;text-align:center;font-size:96px;font-weight:900;letter-spacing:-3px;line-height:1}
.big{position:absolute;top:1130px;left:0;right:0;text-align:center;font-size:330px;font-weight:900;letter-spacing:-14px;line-height:1;color:#ffd400;text-shadow:0 20px 80px rgba(255,212,0,.35)}
.q{position:absolute;top:1480px;left:0;right:0;text-align:center;font-size:52px;font-weight:800}

<div class="l"></div><div class="r"></div><div class="div"></div>

<div class="big">×3?!</div>

</body></html>
