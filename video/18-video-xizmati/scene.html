<!doctype html>
<html><head><meta charset="utf-8">
<script src="cues.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070a1f; }
body { font-family: "Inter Display", Inter, "Noto Color Emoji", sans-serif; color: #fff; }
#bg { position: absolute; inset: 0; }
#world { position: absolute; inset: 0; transform-origin: 540px 960px; }
#world .o { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#notes { position: absolute; left: 0; top: 0; }
#hud { position: absolute; inset: 0; pointer-events: none; }
.t { position: absolute; left: 60px; right: 60px; text-align: center; font-weight: 900; line-height: .95; }
.t span { display: inline-block; white-space: pre; will-change: transform; }
.y { color: #ffd23f; } .g { color: #3ddc84; } .r { color: #ff4757; } .b { color: #5fd3ff; }
.sh { text-shadow: 0 8px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.55); }
.pill { display: inline-block; padding: 14px 36px; border-radius: 999px; font-weight: 900; }
.handle { position: absolute; top: 74px; left: 0; right: 0; text-align: center; font: 800 30px "Inter Display", Inter; letter-spacing: 3px; color: rgba(255,255,255,.55); }
.prog { position: absolute; top: 46px; left: 90px; right: 90px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
.prog i { display: block; height: 100%; background: #ffd23f; width: 0; }
.shadow { width: 900px; height: 90px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.lbl { padding: 14px 32px; border-radius: 20px; font-weight: 900; font-size: 48px; white-space: nowrap; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.emo { font-size: 150px; line-height: 1; }
.phone { width: 420px; height: 746px; border-radius: 54px; padding: 14px; background: #0b0f1c; box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 5px rgba(255,255,255,.16); }
.phone img { width: 100%; height: 100%; border-radius: 42px; object-fit: cover; display: block; }
.phone .tag { position: absolute; left: 50%; bottom: -66px; transform: translateX(-50%) rotate(-3deg); padding: 16px 40px; border-radius: 999px; font: 900 64px/1 "Inter Display", Inter; white-space: nowrap; box-shadow: 0 16px 30px rgba(0,0,0,.45); }
.price { text-align: center; }
.price .k { display: inline-block; padding: 10px 30px; margin-bottom: -18px; border-radius: 999px; background: #fff; color: #10131f; font: 900 44px/1 "Inter Display", Inter; letter-spacing: 2px; position: relative; z-index: 2; transform: rotate(-3deg); }
.price .v { padding: 26px 56px; border-radius: 44px; background: linear-gradient(180deg, #ffe066, #ffbf1f); color: #1a1000; border: 8px solid #fff; font: 900 118px/1 "Inter Display", Inter; letter-spacing: -4px; white-space: nowrap; box-shadow: 0 30px 60px rgba(0,0,0,.5), 0 0 80px rgba(255,210,63,.45); }
.step { width: 840px; display: flex; align-items: center; gap: 34px; padding: 26px 44px; border-radius: 34px; background: rgba(255,255,255,.96); color: #0c1a2e; font: 900 74px/1 "Inter Display", Inter; letter-spacing: -1px; white-space: nowrap; box-shadow: 0 24px 46px rgba(0,0,0,.45); }
.step .ck { flex: none; width: 100px; height: 100px; border-radius: 50%; background: #3ddc84; position: relative; box-shadow: 0 0 30px rgba(61,220,132,.6); }
.step .ck::after { content: ""; position: absolute; left: 33px; top: 18px; width: 26px; height: 48px; border: solid #04230f; border-width: 0 13px 13px 0; transform: rotate(45deg); }
.step .n { flex: none; width: 100px; text-align: center; color: #9aa6bd; font-size: 64px; }
.idea { width: 760px; padding: 30px 40px 36px; border-radius: 40px; background: rgba(255,255,255,.96); color: #0c1a2e; text-align: center; box-shadow: 0 24px 46px rgba(0,0,0,.45); }
.idea .k { font: 900 46px/1 "Inter Display", Inter; letter-spacing: 3px; color: #7a86a0; }
.idea .v { font: 900 120px/1 "Inter Display", Inter; letter-spacing: -4px; color: #ff9f1a; margin-top: 10px; }
.arrow { width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-top: 90px solid #ffd23f; filter: drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
.plat { display: inline-block; margin: 0 10px; padding: 16px 34px; border-radius: 999px; font: 900 56px/1 "Inter Display", Inter; background: #fff; color: #10131f; box-shadow: 0 18px 34px rgba(0,0,0,.45); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.phone .tag { font-size: 84px; bottom: -80px; }

</style></head>
<body>
<div id="bg"></div>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbk" stdDeviation="0 0"/></filter></svg>
<div id="world">
  <canvas id="far" width="1080" height="1920" style="position:absolute;left:0;top:0"></canvas>
  <!-- S0 / S4: portfolio phones + price -->
  <div class="o phone" id="p1"><img data-f="f1" data-ph="20" src="build/pf/f1/001.jpg"></div>
  <div class="o phone" id="p2"><img data-f="f3" data-ph="40" src="build/pf/f3/001.jpg"></div>
  <div class="o phone" id="p0"><img data-f="f2" data-ph="0" src="build/pf/f2/001.jpg"></div>
  <div class="o price" id="price"><span class="k">1 TA VIDEO</span><div class="v">50 000 SO'M</div></div>
  <!-- S1: for whom -->
  <div class="o phone" id="p3"><img data-f="f4" data-ph="0" src="build/pf/f4/001.jpg"><span class="tag" style="background:#ffd23f;color:#1a1000">DO'KON</span></div>
  <div class="o phone" id="p4"><img data-f="f5" data-ph="30" src="build/pf/f5/001.jpg"><span class="tag" style="background:#3ddc84;color:#04230f">BIZNES</span></div>
  <div class="o phone" id="p5"><img data-f="f6" data-ph="60" src="build/pf/f6/001.jpg"><span class="tag" style="background:#ff4d8d;color:#fff">BLOG</span></div>
  <!-- S2: what I do -->
  <div class="o step" id="k1"><span class="ck"></span>SSENARIY</div>
  <div class="o step" id="k2"><span class="ck"></span>O'ZBEKCHA OVOZ</div>
  <div class="o step" id="k3"><span class="ck"></span>MUSIQA</div>
  <div class="o step" id="k4"><span class="ck"></span>MONTAJ</div>
  <!-- S3: you bring the idea -->
  <div class="o idea" id="idea"><div class="k">SIZDAN</div><div class="v">G'OYA</div></div>
  <div class="o arrow" id="arr"></div>
  <div class="o phone" id="p6"><img data-f="f7" data-ph="0" src="build/pf/f7/001.jpg"></div>
  <canvas id="notes" width="1080" height="1920"></canvas>
</div>
<div id="flash"></div>
<div id="hud">
  <div class="prog"><i id="prog"></i></div>
  <div class="handle">@MAMUROVLAB</div>
  <div class="t sh" data-s="0" data-in="-1" data-fx="slam" style="top:200px;font-size:110px;letter-spacing:-4px">SIZGA HAM<br><span class="y">KERAKMI?</span></div>
  <div class="t sh" data-s="1" data-in="0.05" data-fx="slam" style="top:200px;font-size:100px;letter-spacing:-3px">HAR QANDAY<br><span class="g">BIZNES UCHUN</span></div>
  <div class="t" data-s="1" data-in="pl" data-fx="pop" style="top:1690px"><span class="plat">REELS</span><span class="plat">TIKTOK</span><span class="plat">SHORTS</span></div>
  <div class="t sh" data-s="2" data-in="0.05" data-fx="slam" style="top:200px;font-size:96px;letter-spacing:-3px">HAMMASINI<br><span class="y">O'ZIM QILAMAN</span></div>
  <div class="t sh" data-s="3" data-in="0.05" data-fx="slam" style="top:200px;font-size:100px;letter-spacing:-3px">SIZ — FAQAT<br><span class="y">G'OYA</span></div>
  <div class="t sh" data-s="3" data-in="me" data-fx="stamp" style="top:1590px;font-size:70px;letter-spacing:-1px"><span class="pill" style="background:#3ddc84;color:#04230f">MEN — TAYYOR VIDEO</span></div>
  <div class="t sh" data-s="4" data-in="0.05" data-fx="slam" style="top:200px;font-size:96px;letter-spacing:-3px">DIRECT'GA <span class="y">«VIDEO»</span><br>DEB YOZING</div>
  <div class="t" data-s="4" data-in="send" data-fx="pop" style="top:1770px"><span class="pill" style="font-size:54px;background:#fff;color:#06101e">DO'STINGIZGA YUBORING</span></div>
</div>

<script>
const C = window.CUES, ST = C.starts, TOTAL = C.total;
const W = 1080, H = 1920, F = 1000;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, d) => cl((t - a) / d);
const E = {
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  back: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const sDur = i => (ST[i + 1] ?? TOTAL) - ST[i];
const cue = (s, k) => { const v = C['s' + s]?.[k]; return v === undefined ? parseFloat(k) : v; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

const A = [[0, 0], [0, 2600], [2700, 2600], [2700, 0], [0, 0]];
const SCENE_BG = [['#120d3a', '#3a1f6a'], ['#06183a', '#0f4a6a'], ['#0d2a1a', '#1a5a3a'], ['#2a1208', '#6a3a18'], ['#120d3a', '#3a1f6a']];

function shake(k, amp) { if (k <= 0 || k > 1.1) return [0, 0, 0]; const e = Math.exp(-k * 4.5); return [Math.sin(k * 80) * amp * e, Math.cos(k * 70) * amp * e, Math.sin(k * 55) * 1.2 * e]; }
function hold(i, u) {
  const d = sDur(i), p = E.io(cl(u / d));
  let [x, y] = A[i];
  let z = -1000 + 150 * p;
  x += Math.sin(u * 0.9 + i * 1.7) * 18; y += Math.cos(u * 0.7 + i * 2.3) * 12;
  let roll = Math.sin(u * 0.8 + i) * 1.1;
  let s = [0, 0, 0];
  if (i === 0) { z = -1080 + 120 * p; s = shake(u - cue(0, 'price'), 9); }
  if (i === 1) { x += -25 + 50 * p; }
  if (i === 2) { y += -60 + 120 * p; s = shake(u - cue(2, 'all'), 8); }
  if (i === 3) { z = -1150 + 220 * p; s = shake(u - cue(3, 'me'), 10); }
  if (i === 4) { z = -1080 + 120 * p; s = shake(u - cue(4, 'dm'), 6); }
  return { x: x + s[0], y: y + s[1], z, roll: roll + s[2] };
}
const lerp = (a, b, p) => a + (b - a) * p;
const lc = (a, b, p) => ({ x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), z: lerp(a.z, b.z, p), roll: lerp(a.roll, b.roll, p) });
const TW = 0.26;
function sceneAt(t) { let i = 0; ST.forEach((s, k) => { if (t >= s) i = k; }); return i; }
function cam(t) {
  const i = sceneAt(t); let c = hold(i, t - ST[i]);
  if (i + 1 < ST.length && t > ST[i + 1] - TW) c = lc(c, hold(i + 1, t - ST[i + 1]), E.io(seg(t, ST[i + 1] - TW, 2 * TW)));
  if (i > 0 && t < ST[i] + TW) c = lc(hold(i - 1, t - ST[i - 1]), c, E.io(seg(t, ST[i] - TW, 2 * TW)));
  return c;
}
let CAM, FOCUS = 0;
function proj(x, y, z) { const s = F / (z - CAM.z); return { sx: W / 2 + (x - CAM.x) * s, sy: H / 2 + (y - CAM.y) * s, s }; }
const $ = id => document.getElementById(id);
function put(el, x, y, z = 0, sc = 1, rot = 0, op = 1, sx2 = 1, sy2 = 1) {
  if (typeof el === 'string') el = $(el);
  const p = proj(x, y, z);
  if (op <= 0.001 || p.s <= 0 || p.sx < -1600 || p.sx > 2700 || p.sy < -1800 || p.sy > 3700) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.style.transform = `translate(${p.sx}px,${p.sy}px) scale(${p.s * sc}) rotate(${rot}deg) scale(${sx2},${sy2}) translate(-50%,-50%)`;
  el.style.opacity = op;
  const b = Math.min(16, Math.abs(z - FOCUS) * 0.016);
  el.style.filter = b > 0.4 ? `blur(${b}px)` : '';
  el.style.zIndex = Math.round(6000 - z);
}

// ---------- no particles in this reel ----------
function drawNotes(t) {}
const pop = (u, t0, d = .35) => E.back(seg(u, t0, d)), vis = (u, t0) => cl(seg(u, t0, .1));
const FL = $('flash'), IMGS = [...document.querySelectorAll('img[data-f]')];
// portfolio phones play 3 s loops of earlier @mamurovlab reels (30 fps JPG sequences)
window.vidSet = async (t) => {
  let f = 0; ST.forEach((s) => { if (s > 0) f = Math.max(f, 1 - Math.abs(t - s) / 0.1); }); FL.style.opacity = Math.max(0, f) * .35;
  const jobs = [];
  for (const im of IMGS) {
    if (im.parentElement.style.display === 'none') continue;
    const n = 1 + Math.floor((t * 30 + +im.dataset.ph) % 90);
    const src = `build/pf/${im.dataset.f}/${String(n).padStart(3, '0')}.jpg`;
    if (im.getAttribute('src') !== src) { im.setAttribute('src', src); jobs.push(im.decode().catch(() => {})); }
  }
  await Promise.all(jobs);
};
const bump = (u, t0) => { const k = u - t0; return k > 0 && k < 1.2 ? Math.exp(-k * 5) * Math.sin(Math.min(1, k / .08) * Math.PI / 2) : 0; };
function objects(t) {
  const L = i => t - ST[i];
  // S0 + S4: three portfolio phones and the price tag (same spot, so the end loops into the start)
  { const [x, y] = A[0], on = t < ST[1] + .4 || t > ST[4] - .6 ? 1 : 0, u = t > ST[3] ? L(4) : t;
    const b = t > ST[3] ? bump(u, cue(4, 'dm')) : bump(u, cue(0, 'price'));
    put('p1', x - 330, y + 10 + Math.sin(t * 1.4) * 10, 260, 1, -9, on);
    put('p2', x + 330, y + 10 + Math.sin(t * 1.4 + 2) * 10, 260, 1, 9, on);
    put('p0', x, y - 60 + Math.sin(t * 1.4 + 1) * 8, 0, 1, Math.sin(t * .9) * 1.5, on);
    put('price', x, y + 520, 0, 1 + .14 * b, -3 + Math.sin(t * 1.1) * 1.2, on); }
  // S1: who it is for — phones rise one by one with their tags
  { const u = L(1), [x, y] = A[1], on = t > ST[1] - .6 && t < ST[2] + .4 ? 1 : 0;
    [['p3', 't1', -315], ['p4', 't2', 0], ['p5', 't3', 315]].forEach(([id, k, dx], i) => { const k0 = cue(1, k) - .12, p = E.out(seg(u, k0, .45));
      put(id, x + dx, y - 60 + 800 * (1 - p) + Math.sin(t * 1.5 + i) * 8, 0, .62 * (.7 + .3 * E.back(seg(u, k0, .45))), (i - 1) * 5, on * vis(u, k0)); }); }
  // S2: what I do — four steps tick in
  { const u = L(2), [x, y] = A[2], on = t > ST[2] - .6 && t < ST[3] + .4 ? 1 : 0, ba = bump(u, cue(2, 'all'));
    [['k1', -230], ['k2', -50], ['k3', 130], ['k4', 310]].forEach(([id, dy], i) => { const k0 = cue(2, id) - .12, p = E.out(seg(u, k0, .4));
      put(id, x + 900 * (1 - p), y + dy, -20, .88 * (.7 + .3 * E.back(seg(u, k0, .4))) * (1 + .05 * ba), (i % 2 ? 1.5 : -1.5), on * vis(u, k0));
      $(id).querySelector('.ck').style.transform = `scale(${E.back(seg(u, k0 + .25, .3))})`; }); }
  // S3: your idea -> my finished video
  { const u = L(3), [x, y] = A[3], on = t > ST[3] - .6 && t < ST[4] + .4 ? 1 : 0, me = cue(3, 'me');
    put('idea', x, y - 270, -20, .9 * pop(u, .1), -2, on * vis(u, .1));
    put('arr', x, y - 70 + Math.sin(u * 6) * 14, -10, pop(u, .7), 0, on * vis(u, .7));
    put('p6', x, y + 280, 0, .66 * (.6 + .4 * pop(u, me - .25, .45)), 2, on * vis(u, me - .25)); }
}

const far = $('far').getContext('2d');
const bokeh = []; { const r = rng(11); for (let i = 0; i < 70; i++) bokeh.push({ x: -1600 + r() * 11000, y: -2400 + r() * 6600, z: 900 + r() * 2600, rad: 40 + r() * 120, hue: [48, 140, 200, 330, 270][Math.floor(r() * 5)] }); }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function bgAt(t) {
  const i = sceneAt(t); const a = SCENE_BG[i];
  if (i + 1 < ST.length && t > ST[i + 1] - 0.3) { const p = seg(t, ST[i + 1] - 0.3, 0.6); const b = SCENE_BG[i + 1]; return [0, 1].map(k => { const x = hex(a[k]), y = hex(b[k]); return `rgb(${x.map((v, j) => Math.round(lerp(v, y[j], p))).join(',')})`; }); }
  return a;
}
function drawBg(t) {
  const [c1, c2] = bgAt(t);
  $('bg').style.background = `radial-gradient(1200px 1400px at 50% 40%, ${c2} 0%, ${c1} 65%, #05060f 100%)`;
  far.clearRect(0, 0, W, H);
  for (const b of bokeh) {
    const p = proj(b.x, b.y, b.z); if (p.sx < -300 || p.sx > W + 300 || p.sy < -300 || p.sy > H + 300) continue;
    const r = b.rad * p.s * 2.2, g = far.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r);
    g.addColorStop(0, `hsla(${b.hue},90%,65%,.28)`); g.addColorStop(1, `hsla(${b.hue},90%,65%,0)`);
    far.fillStyle = g; far.beginPath(); far.arc(p.sx, p.sy, r, 0, 7); far.fill();
  }
}

const hudItems = [...document.querySelectorAll('#hud [data-s]')].map(el => {
  const fx = el.dataset.fx; const letters = [];
  if (fx === 'slam') {
    const walk = n => { [...n.childNodes].forEach(ch => {
      if (ch.nodeType === 3) { const frag = document.createDocumentFragment(); for (const c of ch.textContent) { const s = document.createElement('span'); s.textContent = c; frag.appendChild(s); letters.push(s); } ch.replaceWith(frag); }
      else if (ch.nodeName !== 'BR') walk(ch); }); };
    walk(el);
  }
  el.style.opacity = 0;
  return { el, s: +el.dataset.s, inK: el.dataset.in, fx, letters };
});
function hudAt(t, vel) {
  for (const it of hudItems) {
    const s0 = ST[it.s], end = (ST[it.s + 1] ?? TOTAL + 1);
    const tin = s0 + cue(it.s, it.inK), tout = end - 0.12, a = t - tin;
    if (a < 0 || t > tout + 0.2) { it.el.style.opacity = 0; continue; }
    const o = 1 - seg(t, tout, 0.2), lag = `translate(${-vel.x * 2}px, ${-vel.y * 2}px)`;
    if (it.fx === 'slam') {
      it.el.style.opacity = o; it.el.style.transform = `${lag} scale(${1 + (1 - o) * .25})`; it.el.style.filter = o < 1 ? `blur(${(1 - o) * 10}px)` : '';
      it.letters.forEach((sp, k) => { const p = seg(a - k * 0.03, 0, 0.34); sp.style.opacity = cl(p * 3);
        sp.style.transform = `translateY(${(1 - E.out(p)) * -80}px) scale(${1 + (1 - E.back(p)) * 1.6}) rotate(${(1 - E.out(p)) * -14}deg)`; });
    } else if (it.fx === 'stamp') {
      const p = seg(a, 0, 0.3), sh = a < 0.5 ? Math.sin(a * 70) * 10 * (1 - a / 0.5) : 0;
      it.el.style.opacity = cl(p * 4) * o; it.el.style.transform = `${lag} translateX(${sh}px) scale(${2.3 - 1.3 * E.back(p)}) rotate(${-6 + 6 * (1 - E.out(p))}deg)`;
    } else if (it.fx === 'pop') {
      const p = seg(a, 0, 0.35); it.el.style.opacity = cl(p * 3) * o; it.el.style.transform = `${lag} scale(${.4 + .6 * E.back(p)})`;
    }
  }
}


window.render = (t) => {
  CAM = cam(t); const pc = cam(Math.max(0, t - 1 / 60));
  const s = F / (0 - CAM.z), vel = { x: (CAM.x - pc.x) * s, y: (CAM.y - pc.y) * s };
  $('world').style.transform = `rotate(${CAM.roll}deg) scale(1.07)`;
  const bx = Math.min(36, Math.abs(vel.x) * 0.45), by = Math.min(36, Math.abs(vel.y) * 0.45);
  $('mbk').setAttribute('stdDeviation', `${bx.toFixed(1)} ${by.toFixed(1)}`);
  $('world').style.filter = (bx > 0.5 || by > 0.5) ? 'url(#mb)' : '';
  drawBg(t); objects(t); drawNotes(t); hudAt(t, vel);
  $('prog').style.width = (100 * cl(t / TOTAL)) + '%';
};
</script>
<script>const __r = window.render; window.render = async (t, s, tot) => { __r(t, s, tot); await window.vidSet(t); };</script>
</body></html>
